name: Monitor Odisseia

on:
  schedule:
    # A cada 15 minutos (horario UTC, mas o intervalo e o que importa)
    - cron: "*/15 * * * *"
  workflow_dispatch: # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write

concurrency:
  group: monitor-odisseia
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Rodar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add sessoes_vistas.json
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza sessoes vistas [skip ci]"
            git push
          fi

